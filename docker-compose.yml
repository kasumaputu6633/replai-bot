services:
  replai-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    env_file:
      - .env
    restart: unless-stopped

  replai-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
